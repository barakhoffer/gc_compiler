[project]
name = "gc-compiler"
version = "0.1.0"
description = "Generic gain-cell (GC-eDRAM) memory compiler built on gdsfactory"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "gdsfactory>=9.44",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "nbmake>=1.5",
    "jupyterlab>=4",
    "ipykernel>=6",
    "pypdf>=5",
]

[project.scripts]
gc-compiler = "gc_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
